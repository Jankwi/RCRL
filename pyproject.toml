[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crtr-compass"
version = "0.1.0"
description = "conditioning CRTR on abstract goals"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gin-config>=0.5.0",
    "joblib>=1.0.0",
    "numpy",
    "wandb>=0.15.0",
    "torch==2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov",
    "ruff>=0.9.0",
]

[project.optional-dependencies]
cpu = [
    "torch==2.9.1",
]
gpu = [
    "torch==2.9.1",
]

# --- Hatchling Build Configuration ---
[tool.hatch.build.targets.wheel]
packages = ["src/contrastivelib"]

# --- Pytest Configuration ---
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --- UV PyTorch Routing ---
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

# --- Ruff Configuration ---
[tool.ruff]
line-length = 100
target-version = "py310"
indent-width = 4

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort, W: warnings
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"